on:
  merge_group:
  pull_request:

name: CI

permissions:
  contents: read

jobs:
  nocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "nocommit checker"
        uses: nobssoftware/nocommit@5c3cf9519fe40b80b0954d254085b67b532a5dc3

  nix-flake-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-latest
          #  FIXME: Mac building the typescript apps is not working on CI.
          #  Issues with building node-modules.  Also it doesn't like enable_kvm
          #  or the extra_nix_config.
          # - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "nix-eval-cache-${{ runner.os }}-${{ runner.arch }}"
          path: "~/.cache/nix"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          enable_kvm: true
          # required for systemd-nspawn nixos tests
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-system-features = uid-range
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true
      - run: nix run .#nix-flake-check-changed

  nix-flake-health:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - run: nix flake show
      - run: nix flake lock --no-update-lock-file
      - run: nix flake check --no-build
